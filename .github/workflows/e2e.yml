name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koentji
          POSTGRES_PASSWORD: koentji
          POSTGRES_DB: koentjilab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U koentji"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_DATABASE_URL: postgres://koentji:koentji@127.0.0.1:5432/koentjilab_test
      E2E_DB_NAME: koentjilab_test
      E2E_DB_USER: koentji
      E2E_DB_PASSWORD: koentji
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: "5432"
      E2E_ADMIN_USERNAME: e2eadmin
      E2E_ADMIN_PASSWORD: e2eadmin
      E2E_SECRET_KEY: koentji-e2e-secret-key-that-is-at-least-64-bytes-long-aaaaaaaaaaaaaaaaa

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch head
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-e2e-

      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: end2end/package.json

      - name: Install root npm deps (tailwindcss)
        run: npm install

      - name: Install Playwright deps
        working-directory: end2end
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Build Tailwind
        run: npx tailwindcss -i style/input.css -o style/output.css --minify

      - name: Run E2E tests
        working-directory: end2end
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: end2end/playwright-report
          retention-days: 14
