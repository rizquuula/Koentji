services:
  app:
    container_name: koentji-app
    restart: unless-stopped
    image: ${APP_IMAGE:-ghcr.io/rizquuula/koentji:latest}
    build: .
    # The app is reachable only on the internal compose network. The nginx
    # service below is the public entrypoint — it gzip-compresses the static
    # WASM/JS/CSS bundle so the multi-MB download doesn't stall on slow links
    # (which left /analytics blank). To hit the app directly for debugging,
    # temporarily add a `ports:` mapping back.
    expose:
      - "3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://koentji:koentji@db:5432/koentjilab}
      # Empty by default so the app uses its built-in dev key fallback.
      # A production deploy MUST set SECRET_KEY (>= 64 bytes) and
      # COOKIE_SECURE=true (see below) or the server refuses to start.
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - AUTH_CACHE_TTL_SECONDS=${AUTH_CACHE_TTL_SECONDS:-900}
      # This bundled stack is fronted by http-only nginx, so it runs as a
      # dev posture by default (Secure cookies aren't sent over http
      # anyway). Production: put TLS in front, set COOKIE_SECURE=true, and
      # provide SECRET_KEY + ADMIN_PASSWORD_HASH — otherwise boot fails closed.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # ClickHouse is optional and external by default — point this at whatever
      # host runs it. The bundled `clickhouse` service below is opt-in via the
      # `clickhouse` compose profile; with it enabled the in-network default
      # (http://koentji:koentji@clickhouse:8123/koentji) works as before.
      # If ClickHouse is unreachable the app still boots: migrations log an
      # error and the analytics sink drops events. Only /analytics degrades.
      - CLICKHOUSE_URL=${CLICKHOUSE_URL:-http://koentji:koentji@clickhouse:8123/koentji}
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false

  nginx:
    container_name: koentji-nginx
    image: nginx:1.27-alpine
    # Public entrypoint. Maps the same host port the app used to publish, so
    # existing deployments keep hitting ${APP_PORT} unchanged — only now the
    # response (notably the WASM bundle) is compressed on the way out.
    ports:
      - "0.0.0.0:${APP_PORT:-3000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    container_name: koentji-clickhouse
    restart: unless-stopped
    # 25.8 LTS. The 24.10 the stack ran before had a global memory tracker that
    # drifted upward and never resynced: it reported 1.52 PiB in use against a
    # real RSS of 512 MiB, which failed every query including SELECT count().
    # 25.x resyncs the tracker against the cgroup periodically, so drift is
    # self-correcting. Note ClickHouse does not support downgrades — going back
    # to 24.x needs the volume recreated, not just the tag reverted.
    image: clickhouse/clickhouse-server:25.8-alpine
    # Opt-in only. Analytics normally point at a ClickHouse running elsewhere
    # (set CLICKHOUSE_URL). To run the bundled one alongside the stack:
    #   docker compose --profile clickhouse up -d
    profiles:
      - clickhouse
    environment:
      CLICKHOUSE_DB: koentji
      CLICKHOUSE_USER: koentji
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-koentji}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "0.0.0.0:${CLICKHOUSE_PORT:-8123}:8123"
    volumes:
      - ./chdata:/var/lib/clickhouse
      - ./clickhouse/config.d/low-mem.xml:/etc/clickhouse-server/config.d/low-mem.xml:ro
      - ./clickhouse/users.d/low-mem.xml:/etc/clickhouse-server/users.d/low-mem.xml:ro
    # Hard cap. ClickHouse reads this cgroup bound as its available RAM and
    # sizes itself against it, so this is the real limit, not just a backstop.
    # It stays above the 1.5 GiB max_server_memory_usage in config.d/low-mem.xml
    # so the server refuses a query cleanly before the OOM killer takes the
    # whole container. Generous for the workload: auth_events is ~6 MB.
    mem_limit: 2g
    mem_reservation: 512m
    # Lets ClickHouse set its NUMA memory policy at boot. Without CAP_SYS_NICE
    # the get_mempolicy/set_mempolicy syscalls return EPERM under Docker's
    # default profile, logging a harmless "get_mempolicy: Operation not
    # permitted" warning. Cosmetic — silences the noise.
    cap_add:
      - SYS_NICE
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # Reads the body rather than using --spider. --spider closes the socket
      # once headers arrive, so ClickHouse logs a NETWORK_ERROR "connection
      # reset by peer" on every probe — noise that buries real errors.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://clickhouse:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - path: .env
        required: false

  db:
    container_name: koentji-db
    restart: unless-stopped
    image: ${DB_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koentji}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koentji}
      POSTGRES_DB: ${POSTGRES_DB:-koentjilab}
    ports:
      - "0.0.0.0:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koentji} -d ${POSTGRES_DB:-koentjilab}"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - path: .env
        required: false

volumes:
  pgdata:
  chdata:
